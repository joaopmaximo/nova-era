services:
  db:
    image: postgres:16-alpine
    container_name: clients_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: clients_web
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    restart: always
    command: sh -c "python seed_dev.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
