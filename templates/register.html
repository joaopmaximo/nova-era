{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Novo Cliente</h2>
    </div>
    
    {% if message %}
    <div class="alert {% if success %}alert-success{% else %}alert-error{% endif %}">
        {{ message }}
    </div>
    {% endif %}
    
    <form action="/register" method="post">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Nome *</label>
                <input type="text" name="name" class="form-input" required placeholder="João Silva">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-input" required placeholder="joao@email.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Telefone</label>
                <input type="text" name="phone" class="form-input" placeholder="(11) 99999-9999">
            </div>
            
            <div class="form-group">
                <label class="form-label">Documento (CPF/CNPJ)</label>
                <input type="text" name="document" class="form-input" placeholder="000.000.000-00">
            </div>
            
            <div class="form-group full-width">
                <label class="form-label">Endereço</label>
                <input type="text" name="address" class="form-input" placeholder="Rua Example, 123 - São Paulo, SP">
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
            <a href="/clients" class="btn btn-secondary">Ver Clientes</a>
        </div>
    </form>
</div>
{% endblock %}
