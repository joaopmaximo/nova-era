<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">Clientes</a>
            <div class="nav-links">
                <a href="/register" class="nav-link {% if request.url.path == '/register' %}active{% endif %}">Cadastro</a>
                <a href="/clients" class="nav-link {% if request.url.path == '/clients' %}active{% endif %}">Clientes</a>
            </div>
        </div>
    </nav>
    
    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
