<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros Nova Era</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center mr-8">
                        <img src="/static/images/logo.png" alt="Logo" class="h-10 w-auto">
                    </a>
                    {% if user %}
                    <div class="hidden sm:flex sm:space-x-8">
                        <a href="/turmas" class="text-slate-600 hover:text-slate-900 px-3 py-2 text-sm font-medium">Turmas</a>
                        <a href="/alunos" class="text-slate-600 hover:text-slate-900 px-3 py-2 text-sm font-medium">Alunos</a>
                        <a href="/cursos" class="text-slate-600 hover:text-slate-900 px-3 py-2 text-sm font-medium">Cursos</a>
                    </div>
                    {% endif %}
                </div>
                {% if user %}
                <div class="flex items-center gap-4">
                    <span class="text-sm text-slate-500">Olá, <span class="font-semibold text-slate-700">{{ user.username }}</span></span>
                    <a href="/logout" class="inline-flex items-center px-3 py-1.5 border border-slate-300 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 transition-all duration-200">
                        Sair
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    </body>
</html>
